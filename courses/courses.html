        .course-page {

            margin: 0 auto;
        }
        
        .back-btn {
            display: inline-flex;

            gap: 8px;
            background: var(--light-color);
            color: var(--dark-color);
            padding: 0.75rem 1.5rem;
            border-radius: var(--border-radius);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: var(--primary-color);
            color: white;
        }
        
        .grade-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));

            padding: 3rem 2rem;
            border-radius: var(--border-radius);
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .grade-title {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .subject-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: transform 0.3s;
        }
        
        .subject-card:hover {
            transform: translateY(-5px);
        }
        
        .subject-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 1rem;
        }
        
        .subject-math .subject-icon { background: #4361ee; color: white; }
        .subject-science .subject-icon { background: #7209b7; color: white; }
        .subject-russian .subject-icon { background: #3a0ca3; color: white; }

        .subject-history .subject-icon { background: #f72585; color: white; }
        .subject-coding .subject-icon { background: #2a9d8f; color: white; }
        
        .lesson-list {
            list-style: none;
            margin: 1rem 0;
        }
        
        .lesson-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .lesson-list li:last-child {
            border-bottom: none;
        }
        
        .progress-btn {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 600;
        }
        
        .progress-btn:hover {
            background: var(--secondary-color);
        }
        
        @media (max-width: 768px) {
            .grade-title {

            }

        // Обновляем страницу с данными класса
        function loadGradeData() {
            const data = gradeData[grade] || gradeData[5];
            
            // Обновляем заголовки
            document.getElementById('gradeNumber').textContent = grade;
            document.getElementById('gradeTitle').textContent = data.title;
            document.getElementById('gradeDescription').textContent = data.description;
            document.getElementById('footerGrade').textContent = grade;
            document.title = `Курсы для ${grade} класса | EduMaster`;
            
            // Загружаем предметы
            const subjectsGrid = document.getElementById('subjectsGrid');
            let html = '';
            
            data.subjects.forEach(subject => {
                html += `
                <div class="subject-card ${subject.class}">
                    <div class="subject-icon">${subject.icon}</div>
                    <h3>${subject.name}</h3>
                    <ul class="lesson-list">
                        ${subject.lessons.map(lesson => `<li>✓ ${lesson}</li>`).join('')}
                    </ul>
                    <button class="progress-btn" onclick="startSubject('${subject.name}')">
                        Начать курс
                    </button>
                </div>`;
            });
            
            subjectsGrid.innerHTML = html;
        }
        
        // Начать предмет
        function startSubject(subjectName) {
            alert(`Начинаем курс "${subjectName}" для ${grade} класса!`);
            // Здесь можно добавить сохранение прогресса
            localStorage.setItem(`course_${grade}_${subjectName}`, 'started');
        }
        
        // Начать все курсы
        function startAllCourses() {
            const data = gradeData[grade] || gradeData[5];
            data.subjects.forEach(subject => {
                localStorage.setItem(`course_${grade}_${subject.name}`, 'started');
            });
            alert(`Все курсы для ${grade} класса начаты!`);
        }
